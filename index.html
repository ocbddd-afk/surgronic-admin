<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Surgronic — Super Admin</title>
<style>
:root{--navy-950:#08142A;--navy-900:#0C1B36;--navy-700:#153A72;--blue-500:#2F86F6;--blue-400:#5AA2F8;--mist-50:#F2F5FA;--ink-600:#5B6B82;--line:#E2E8F2;--green:#16A34A;--amber:#D97706;--red:#DC2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--mist-50);color:var(--navy-950);min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy-950);padding:24px}
.login-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.login-card .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:800;font-size:1.3rem}
.login-card h1{font-size:1.1rem;margin-bottom:4px}
.login-card p.sub{color:var(--ink-600);font-size:.88rem;margin-bottom:24px}
.login-card label{display:block;font-size:.82rem;font-weight:600;margin:14px 0 6px}
.login-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:.95rem}
.login-card input:focus{outline:2px solid var(--blue-500);border-color:var(--blue-500)}
.login-card button{width:100%;margin-top:22px;padding:13px;background:var(--blue-500);color:#fff;border:0;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer}
.login-card button:hover{background:var(--blue-400)}
.login-err{display:none;margin-top:14px;padding:10px 14px;background:#FEF2F2;border:1px solid #FECACA;color:var(--red);border-radius:10px;font-size:.85rem}
.app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--navy-950);color:#fff;padding:24px 16px;z-index:50;display:flex;flex-direction:column}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px;font-weight:800;font-size:1.15rem;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.sidebar nav{display:flex;flex-direction:column;gap:4px}
.sidebar nav button{background:none;border:0;color:#9FB0C8;text-align:left;padding:12px 14px;border-radius:10px;font-size:.92rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px}
.sidebar nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar nav button.on{background:var(--blue-500);color:#fff}
.sidebar .who{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.82rem;color:#9FB0C8}
.sidebar .who button{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px 12px;font-size:.8rem;cursor:pointer;margin-top:8px;width:100%}
.main{margin-left:240px;padding:32px;max-width:1200px}
.main h2{font-size:1.5rem;margin-bottom:4px}
.main .crumb{color:var(--ink-600);font-size:.88rem;margin-bottom:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.kpi .v{font-size:1.9rem;font-weight:800;color:var(--navy-950)}
.kpi .l{font-size:.82rem;color:var(--ink-600);margin-top:4px}
.kpi .v.blue{color:var(--blue-500)}.kpi .v.green{color:var(--green)}.kpi .v.amber{color:var(--amber)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}
.card h3{font-size:1.05rem;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;padding:10px 12px;color:var(--ink-600);font-weight:600;border-bottom:2px solid var(--line);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td{padding:12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.76rem;font-weight:700}
.badge.new{background:#DBEAFE;color:#1D4ED8}.badge.open{background:#FEF3C7;color:#92400E}
.badge.quoted{background:#D1FAE5;color:#065F46}.badge.converted{background:#E0E7FF;color:#3730A3}
.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:.9rem}
.toolbar button{padding:11px 20px;background:var(--navy-950);color:#fff;border:0;border-radius:10px;font-weight:600;cursor:pointer}
.loading{text-align:center;padding:40px;color:var(--ink-600)}
.empty{text-align:center;padding:40px;color:var(--ink-600)}
.funnel{display:flex;flex-direction:column;gap:10px}
.funnel .row{display:flex;align-items:center;gap:12px}
.funnel .bar{height:28px;background:var(--blue-500);border-radius:8px;min-width:4px}
.funnel .lbl{font-size:.85rem;min-width:120px;color:var(--ink-600)}
.funnel .num{font-size:.85rem;font-weight:700;min-width:70px;text-align:right}
@media(max-width:768px){.sidebar{width:100%;position:static;padding:12px 16px}.sidebar nav{flex-direction:row;overflow-x:auto}.sidebar .who{display:none}.main{margin-left:0;padding:20px}}
</style>
</head>
<body>
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="logo">🏥 Surgronic</div>
    <h1>Super Admin</h1>
    <p class="sub">Restricted access. All activity is logged.</p>
    <form id="loginForm">
      <label for="le">Email</label>
      <input id="le" type="email" required autocomplete="username" placeholder="you@surgronic.com">
      <label for="lp">Password</label>
      <input id="lp" type="password" required autocomplete="current-password" placeholder="••••••••">
      <div class="login-err" id="loginErr">Invalid email or password.</div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">🏥 Surgronic</div>
    <nav>
      <button data-sec="dash" class="on">📊 Dashboard</button>
      <button data-sec="rfq">📥 RFQ Pipeline</button>
      <button data-sec="prod">📦 Products</button>
      <button data-sec="inv">🏭 Inventory</button>
      <button data-sec="ana">📈 Analytics</button>
    </nav>
    <div class="who"><div id="whoName"></div><button id="logoutBtn">Sign out</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
var API = "https://surgronic.pages.dev/actions";
var ADMIN_USERS = [
  { email: "yusuf@surgronic.com",  name: "Yusuf Mohamed",    salt: "sg-yusuf-01",    passHash: "5d477109b125ddf6b0d464e35e05e86232a5023b66593597c34c8e3227ac9c41" },
  { email: "bouziani00@gmail.com", name: "Younesse Bouziani", salt: "sg-younesse-01", passHash: "1fdcdddceb3003c835bee0da4d6a29a2e487aae264f7c743a65ef40987c056f7" }
];
function sha256(s){ return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join(""); }); }
function api(action, args){
  return fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({action:action, args:args||{}})}).then(function(r){ return r.json(); }).then(function(j){ if(j.error) throw new Error(j.error); return j.data; });
}
function fmt(n){ return (n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  var email = document.getElementById("le").value.trim().toLowerCase();
  var pw = document.getElementById("lp").value;
  var u = ADMIN_USERS.find(function(x){ return x.email === email; });
  var err = document.getElementById("loginErr");
  err.style.display = "none";
  if(!u){ err.style.display = "block"; return; }
  sha256(u.salt + ":" + pw).then(function(h){
    if(h === u.passHash){
      try{ sessionStorage.setItem("sg_admin", JSON.stringify({email:u.email, name:u.name, ts:Date.now()})); }catch(e){}
      enterApp(u);
    } else { err.style.display = "block"; }
  });
});
function enterApp(u){
  document.getElementById("loginWrap").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("whoName").textContent = u.name + " (" + u.email + ")";
  showSection("dash");
}
document.getElementById("logoutBtn").addEventListener("click", function(){
  try{ sessionStorage.removeItem("sg_admin"); }catch(e){}
  location.reload();
});
(function(){
  try{
    var s = JSON.parse(sessionStorage.getItem("sg_admin")||"null");
    if(s && ADMIN_USERS.some(function(x){return x.email===s.email;}) && Date.now()-s.ts < 12*3600*1000){
      var u = ADMIN_USERS.find(function(x){return x.email===s.email;});
      enterApp(u);
    }
  }catch(e){}
})();
document.querySelectorAll(".sidebar nav button").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".sidebar nav button").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    showSection(b.getAttribute("data-sec"));
  });
});
function showSection(sec){
  var m = document.getElementById("main");
  m.innerHTML = '<div class="loading">Loading…</div>';
  if(sec==="dash") renderDash(m);
  else if(sec==="rfq") renderRfqs(m);
  else if(sec==="prod") renderProducts(m);
  else if(sec==="inv") renderInventory(m);
  else if(sec==="ana") renderAnalytics(m);
}
function renderDash(m){
  api("getOverview").then(function(d){
    var rfq = d.rfqs||{}, inv = d.inventory||{};
    m.innerHTML =
      '<h2>Dashboard</h2><p class="crumb">Live from the storefront database · ' + new Date().toLocaleString() + '</p>'+
      '<div class="kpis">'+
        kpi(fmt(inv.skus), "Products in catalog", "blue")+
        kpi(fmt(rfq.newCount), "New RFQs", rfq.newCount>0?"amber":"")+
        kpi(fmt(rfq.openCount), "Open RFQs", "")+
        kpi(fmt(rfq.quotedCount), "Quoted", "green")+
        kpi(fmt(rfq.convertedCount), "Converted to orders", "green")+
        kpi(fmt(d.ordersTotal), "Total orders", "")+
      '</div>'+
      '<div class="card"><h3>RFQ Pipeline</h3><div class="funnel">'+
        funnelRow("New", rfq.newCount, "#1D4ED8")+
        funnelRow("Open", rfq.openCount, "#D97706")+
        funnelRow("Quoted", rfq.quotedCount, "#16A34A")+
        funnelRow("Converted", rfq.convertedCount, "#3730A3")+
      '</div></div>'+
      '<div class="card"><h3>Inventory snapshot</h3><table>'+
        '<tr><th>Metric</th><th>Value</th></tr>'+
        '<tr><td>Total SKUs</td><td><b>'+fmt(inv.skus)+'</b></td></tr>'+
        '<tr><td>Out of stock lines</td><td>'+fmt(inv.outOfStock)+'</td></tr>'+
        '<tr><td>Low stock lines</td><td>'+fmt(inv.lowStock)+'</td></tr>'+
      '</table></div>';
  }).catch(function(e){ m.innerHTML = '<div class="empty">Failed to load: '+esc(e.message)+'</div>'; });
}
function kpi(v,l,c){ return '<div class="kpi"><div class="v '+(c||"")+'">'+v+'</div><div class="l">'+l+'</div></div>'; }
function funnelRow(l,n,color){
  var maxN = Math.max(1, n||0);
  var pct = Math.max(3, Math.min(100, (n||0)/maxN*100));
  return '<div class="row"><div class="lbl">'+l+'</div><div class="bar" style="width:'+pct+'%;background:'+color+'"></div><div class="num">'+fmt(n)+'</div></div>';
}
function renderRfqs(m){
  api("listRfqs",{limit:100}).then(function(d){
    var rows = (d.rfqs||[]).map(function(r){
      return '<tr><td><b>'+esc(r.id||r.sku||"—")+'</b></td><td>'+esc(r.name||r.contactName||"—")+'</td>'+
        '<td>'+esc(r.email||r.contactEmail||"—")+'</td><td><span class="badge '+(r.status||"new").toLowerCase()+'">'+esc(r.status||"new")+'</span></td>'+
        '<td>'+esc(r.createdAt||r.created_at||"—")+'</td></tr>';
    }).join("");
    m.innerHTML = '<h2>RFQ Pipeline</h2><p class="crumb">'+(d.rfqs||[]).length+' requests</p>'+
      '<div class="card">'+(rows?'<table><tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th><th>Created</th></tr>'+rows+'</table>':'<div class="empty">No RFQs yet. New quote requests from the storefront will appear here.</div>')+'</div>';
  }).catch(function(e){ m.innerHTML = '<div class="empty">Failed to load: '+esc(e.message)+'</div>'; });
}
var prodPage = 0;
function renderProducts(m, q){
  q = q||"";
  m.innerHTML = '<h2>Products</h2><p class="crumb">Same catalog as the storefront</p>'+
    '<div class="card"><div class="toolbar"><input id="pq" placeholder="Search by name, SKU or reference…" value="'+esc(q)+'"><button id="pgo">Search</button></div><div id="pout"><div class="loading">Loading…</div></div></div>';
  function load(){
    var args = {limit:25, offset:prodPage*25};
    if(q) args.q = q;
    api("listProducts", args).then(function(d){
      var rows = (d.products||[]).map(function(p){
        return '<tr><td><b>'+esc(p.sku)+'</b></td><td>'+esc(p.name)+'</td><td>'+esc(p.brand||"—")+'</td><td>'+(p.price!=null?esc(p.price):"Price on request")+'</td></tr>';
      }).join("");
      var total = d.total||0, pages = Math.ceil(total/25);
      document.getElementById("pout").innerHTML =
        '<p style="margin-bottom:12px;color:var(--ink-600);font-size:.88rem">'+fmt(total)+' products · page '+(prodPage+1)+' of '+fmt(pages)+'</p>'+
        (rows?'<table><tr><th>SKU</th><th>Name</th><th>Brand</th><th>Price</th></tr>'+rows+'</table>':'<div class="empty">No products found.</div>')+
        '<div style="margin-top:16px;display:flex;gap:8px">'+
          '<button id="pprev" style="padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer" '+(prodPage===0?"disabled":"")+'>← Prev</button>'+
          '<button id="pnext" style="padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer" '+(prodPage>=pages-1?"disabled":"")+'>Next →</button>'+
        '</div>';
      var pv=document.getElementById("pprev"), nx=document.getElementById("pnext");
      if(pv) pv.addEventListener("click", function(){ if(prodPage>0){prodPage--; load();} });
      if(nx) nx.addEventListener("click", function(){ prodPage++; load(); });
    }).catch(function(e){ document.getElementById("pout").innerHTML = '<div class="empty">Failed: '+esc(e.message)+'</div>'; });
  }
  document.getElementById("pgo").addEventListener("click", function(){ prodPage=0; q=document.getElementById("pq").value.trim(); load(); });
  document.getElementById("pq").addEventListener("keydown", function(e){ if(e.key==="Enter"){ prodPage=0; q=e.target.value.trim(); load(); } });
  load();
}
function renderInventory(m){
  api("listInventory",{limit:50}).then(function(d){
    var rows = (d.items||[]).map(function(i){
      return '<tr><td><b>'+esc(i.sku)+'</b></td><td>'+esc(i.name)+'</td><td>'+fmt(i.physical||i.qty||0)+'</td><td>'+esc(i.warehouse||"—")+'</td></tr>';
    }).join("");
    m.innerHTML = '<h2>Inventory</h2><p class="crumb">Stock lines</p>'+
      '<div class="card">'+(rows?'<table><tr><th>SKU</th><th>Product</th><th>Qty</th><th>Warehouse</th></tr>'+rows+'</table>':'<div class="empty">No inventory lines.</div>')+'</div>';
  }).catch(function(e){ m.innerHTML = '<div class="empty">Failed to load: '+esc(e.message)+'</div>'; });
}
function renderAnalytics(m){
  api("getAnalytics").then(function(d){
    var c = d.counts||{}, cv = d.conversion||{};
    m.innerHTML = '<h2>Analytics</h2><p class="crumb">Storefront activity</p>'+
      '<div class="kpis">'+
        kpi(fmt(c.pageViews), "Page views", "blue")+
        kpi(fmt(c.productViews), "Product views", "blue")+
        kpi(fmt(c.searches), "Searches", "")+
        kpi(fmt(c.addToCart), "Add to quote", "")+
        kpi(fmt(c.quoteRequests), "Quote requests", "green")+
        kpi(fmt(c.ordersCompleted), "Orders completed", "green")+
      '</div>'+
      '<div class="card"><h3>Conversion</h3><table>'+
        '<tr><th>Step</th><th>Rate</th></tr>'+
        '<tr><td>View → quote</td><td>'+(cv.viewToCart!=null?cv.viewToCart+"%":"—")+'</td></tr>'+
        '<tr><td>Quote → checkout</td><td>'+(cv.cartToCheckout!=null?cv.cartToCheckout+"%":"—")+'</td></tr>'+
        '<tr><td>Checkout → order</td><td>'+(cv.checkoutToOrder!=null?cv.checkoutToOrder+"%":"—")+'</td></tr>'+
      '</table></div>';
  }).catch(function(e){ m.innerHTML = '<div class="empty">Failed to load: '+esc(e.message)+'</div>'; });
}
</script>
</body>
</html>
